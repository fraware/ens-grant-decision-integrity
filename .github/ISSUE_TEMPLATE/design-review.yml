name: Design review
description: Challenge a requirement, field, or trust assumption
body:
  - type: markdown
    attributes:
      value: |
        Please identify a concrete failure mode, unnecessary requirement, missing invariant, or implementation cost.
  - type: input
    id: surface
    attributes:
      label: Decision surface
      description: Which Charter section, schema field, or example does this concern?
      placeholder: e.g. CHARTER §5.3 or evaluation.materialFindings
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What fails, becomes ambiguous, or creates disproportionate process cost?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or scenario
      description: Give a concrete workflow, counterexample, or source if available.
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: What is the smallest change that resolves the issue?
