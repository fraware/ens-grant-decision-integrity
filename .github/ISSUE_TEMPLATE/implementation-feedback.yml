name: Implementation feedback
description: Report friction from using the Charter or decision schema in a real review process
body:
  - type: markdown
    attributes:
      value: |
        Report friction from an actual review or accountability workflow. Do not include applicant-confidential material.
  - type: input
    id: workflow
    attributes:
      label: Workflow
      placeholder: e.g. grant committee review, milestone verification, appeal handling
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was difficult or missing?
    validations:
      required: true
  - type: textarea
    id: minimum
    attributes:
      label: Minimum viable correction
      description: What change would make the artifact practical for this workflow?
