name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/conformance.py --strict examples/spp3-marketplace-rfp.example.json
      - run: python scripts/test_conformance.py
