name: validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r phase2/requirements.txt
      - run: python -m pip install -e .
      - run: python scripts/validate.py
      - run: python scripts/conformance.py examples/spp3-marketplace-rfp.example.json
      - run: python scripts/test_conformance.py
      - run: python scripts/test_regressions.py
      - run: python -m pytest scripts/test_source_artifact.py scripts/test_policy_pins.py
      - run: python -m pytest tests/test_source_capture.py tests/test_capture_provenance.py
      - run: python -m pytest scripts/test_corpus.py scripts/test_corpus_validator_binding.py scripts/test_study_status.py scripts/test_second_annotation.py scripts/test_corpus_adversarial_ws01.py
      - run: python -m pytest scripts/test_claims_registry.py scripts/test_gdi_bundle.py
      - run: python -m pytest scripts/test_profiles.py scripts/test_adapters.py
      - run: python scripts/corpus_metrics.py corpus/case-template.json
      - run: python scripts/validate_corpus_cases.py
      - run: python scripts/study_status.py
      - run: gdi claims --id C2
      - run: gdi trust-policy tests/fixtures/trust/test-trust-policy.json
      - run: gdi profiles --format json

  phase2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r phase2/requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest phase2/tests

  schema-02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r phase2/requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest scripts/test_schema_02.py
      - run: python -m pytest projection/tests tests/test_projection_generative.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m build
      - name: Install wheel into clean venv and smoke-test substantive CLI
        run: |
          set -euo pipefail
          repo="$PWD"
          wheel="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          rm -rf /tmp/gdi-wheel /tmp/gdi-smoke
          python -m venv /tmp/gdi-wheel
          /tmp/gdi-wheel/bin/python -m pip install "$wheel"
          mkdir -p /tmp/gdi-smoke
          cp "$repo/examples/spp3-marketplace-rfp.example.json" /tmp/gdi-smoke/record.json
          cp "$repo/examples/tier-a-simplified-grant.example.json" /tmp/gdi-smoke/tier.json
          cp "$repo/projection/examples/tier-a-projection-spec-v2.json" /tmp/gdi-smoke/spec.json
          cp "$repo/tests/fixtures/trust/test-trust-policy.json" /tmp/gdi-smoke/policy.json
          cp -R "$repo/examples/verification-bundle" /tmp/gdi-smoke/bundle
          cp "$repo/phase2/examples/retrospective-public.bundle.json" /tmp/gdi-smoke/phase2.json
          cp "$repo/phase2/vectors/rekor-fixture-trust-root.pem" /tmp/gdi-smoke/rekor-root.pem
          cd /tmp/gdi-smoke
          /tmp/gdi-wheel/bin/gdi --version
          /tmp/gdi-wheel/bin/gdi claims --id C2
          /tmp/gdi-wheel/bin/gdi profiles --format json
          /tmp/gdi-wheel/bin/gdi verify-record record.json
          /tmp/gdi-wheel/bin/gdi trust-policy policy.json
          /tmp/gdi-wheel/bin/gdi verify-bundle bundle --json
          /tmp/gdi-wheel/bin/gdi project --confidential tier.json --spec spec.json --out public.json
          /tmp/gdi-wheel/bin/gdi verify-projection --confidential tier.json --spec spec.json --public public.json
          /tmp/gdi-wheel/bin/gdi verify-phase2 phase2.json --trust-root rekor-root.pem --json

  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt -r phase2/requirements.txt
      - run: python -m pip install -e .
      - name: Ruff lint on release-facing modules
        run: >-
          python -m ruff check
          src/gdi/cli.py
          src/gdi/bundle.py
          src/gdi/report.py
          src/gdi/resources.py
          src/gdi/core/runtime.py
          src/gdi/source/artifact.py
          src/gdi/source/capture.py
          src/gdi/source/policy_pins.py
          src/gdi/trust/policy.py
          src/gdi/phase2/__init__.py
          src/gdi/projection/__init__.py
          adapters
          tests/test_capture_provenance.py
          tests/test_projection_generative.py
          scripts/test_profiles.py
          scripts/test_adapters.py
      - name: Mypy on adapters (gradual typing)
        run: python -m mypy adapters

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Dependency audit on development pins
        run: python -m pip_audit -r requirements-dev.txt
      - name: Emit missing runtime artifact hashes for lock finalization
        run: |
          set -euo pipefail
          rm -rf /tmp/gdi-runtime-downloads
          mkdir -p /tmp/gdi-runtime-downloads
          python -m pip download --no-deps -d /tmp/gdi-runtime-downloads \
            rfc8785==0.1.4 jcs==0.2.1 cryptography==50.0.0 asn1crypto==1.5.1 \
            cffi==2.1.1 pycparser==3.0
          python -m pip hash /tmp/gdi-runtime-downloads/*
      - name: Confirm lock and packaging docs present
        run: |
          test -f requirements.lock.txt
          test -f docs/PACKAGING-AND-SECURITY.md
          test -f docs/BRANCH-PROTECTION.md
          echo "Runtime lock is finalized in this release hardening pull request."
          echo "No byte-reproducible-build claim is made without independent evidence."
