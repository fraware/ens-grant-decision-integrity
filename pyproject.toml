[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ens-gdi"
version = "0.4.0"
description = "ENS Grant Decision Integrity unified verifier"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ENS GDI contributors" }]
dependencies = [
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.12.11",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "build==1.3.0",
]
sbom = [
  "cyclonedx-bom==6.1.2",
]
phase2 = [
  # Installed from phase2/requirements.txt in CI; listed here for documentation only.
]

[project.scripts]
gdi = "gdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdi = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "adapters", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["adapters"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
