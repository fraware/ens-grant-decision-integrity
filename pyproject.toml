[build-system]
requires = ["setuptools==84.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ens-gdi"
version = "0.4.0"
description = "ENS Grant Decision Integrity verifier and evidence tooling"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ENS GDI contributors" }]
dependencies = [
  "jsonschema==4.26.0",
  "rfc8785==0.1.4",
  "jcs==0.2.1",
  "cryptography==50.0.0",
  "asn1crypto==1.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.12.11",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "build==1.3.0",
]
sbom = [
  "cyclonedx-bom==6.1.2",
]

[project.scripts]
gdi = "gdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gdi = ["py.typed"]

[tool.setuptools.data-files]
"ens_gdi/schema" = ["schema/*.json"]
"ens_gdi/claims" = ["claims/*.json"]
"ens_gdi/profiles" = ["profiles/*.json"]
"ens_gdi/projection/src" = ["projection/src/*.py"]
"ens_gdi/projection/schema" = ["projection/schema/*.json"]
"ens_gdi/phase2/src" = ["phase2/src/*.py"]
"ens_gdi/phase2/src/anchors" = ["phase2/src/anchors/*.py"]
"ens_gdi/phase2/schema" = ["phase2/schema/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "adapters", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["adapters"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
